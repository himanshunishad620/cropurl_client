</style>
</defs>
<text x="4" y="35" font-family="Inter, Arial, Helvetica, sans-serif" font-weight="700" font-size="32"><tspan fill="#FFFFFF">Crop</tspan><tspan fill="#1560D4">URL</tspan></text>
</svg>
